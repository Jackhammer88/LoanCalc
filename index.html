<!DOCTYPE html>
<html>

<head>
    <title>LoanCalc — кредитный калькулятор</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#2b3a8f" />
    <link rel="stylesheet" href="./app.css" />
</head>

<body style="margin: 0; overflow: hidden">
<div id="out">
    <!-- Заставка на время загрузки рантайма: Avalonia очищает #out при старте,
         поэтому специально скрывать её не нужно. -->
    <div class="app-splash">
        <img class="app-splash__icon" src="./favicon.svg" width="96" height="96" alt="" />

        <div class="app-splash__text">
            <div class="app-splash__title">LoanCalc</div>
            <div class="app-splash__subtitle">кредитный калькулятор</div>
        </div>

        <div class="app-splash__bar"><span></span></div>
    </div>
</div>
<script type='module' src="./main.js"></script>
</body>

</html>
